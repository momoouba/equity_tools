# 基础镜像使用阿里云公开镜像（国内拉取更快）；若镜像不可用可改回 mysql:8.0 / nginx:alpine
services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: newsapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassword123!}
      MYSQL_DATABASE: ${DB_NAME:-investment_tools}
      MYSQL_USER: ${DB_USER:-newsapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-NewsApp@2024}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - newsapp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newsapp
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-newsapp}
      DB_PASSWORD: ${DB_PASSWORD:-NewsApp@2024}
      DB_NAME: ${DB_NAME:-investment_tools}
      TZ: Asia/Shanghai
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # 不设 CSRC_GUIDANCE_PLAYWRIGHT_EXECUTABLE 时使用镜像构建阶段安装的 Playwright Chromium
      CSRC_GUIDANCE_USE_PLAYWRIGHT: ${CSRC_GUIDANCE_USE_PLAYWRIGHT:-1}
      # 生产建议强制 Playwright，避免 silently fallback 到 requests 导致取到旧页 0 条
      CSRC_GUIDANCE_REQUIRE_PLAYWRIGHT: ${CSRC_GUIDANCE_REQUIRE_PLAYWRIGHT:-1}
      CSRC_GUIDANCE_TLS_VERIFY: ${CSRC_GUIDANCE_TLS_VERIFY:-0}
      # 百度百科 Playwright：生产用 headless（容器内 Chromium）；本机 PoC 可改为 cdp
      BAIKE_BROWSER_MODE: ${BAIKE_BROWSER_MODE:-headless}
      BAIKE_CDP_URL: ${BAIKE_CDP_URL:-http://127.0.0.1:9222}
      # 代理配置 - 用于访问被墙的网站(证监会等)
      # 格式: http://<Mac局域网IP>:<代理端口>
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,mysql,wewe-rss,host.docker.internal}
      ALL_PROXY: ${ALL_PROXY:-}
      # 竞品分析 S4 联网（从宿主机 .env 注入）
      COMPETITOR_WEB_TIMEOUT_MS: ${COMPETITOR_WEB_TIMEOUT_MS:-180000}
      COMPETITOR_WEB_RETRIES: ${COMPETITOR_WEB_RETRIES:-3}
      COMPETITOR_WEB_NO_SEARCH_TIMEOUT_MS: ${COMPETITOR_WEB_NO_SEARCH_TIMEOUT_MS:-300000}
      COMPETITOR_WEB_524_BACKOFF_MS: ${COMPETITOR_WEB_524_BACKOFF_MS:-120000}
      LLM_GATEWAY_ASYNC_RESPONSES: ${LLM_GATEWAY_ASYNC_RESPONSES:-1}
      LLM_RESPONSES_SUBMIT_TIMEOUT_MS: ${LLM_RESPONSES_SUBMIT_TIMEOUT_MS:-45000}
      LLM_RESPONSES_POLL_MAX_MS: ${LLM_RESPONSES_POLL_MAX_MS:-900000}
      LLM_RESPONSES_POLL_INTERVAL_MS: ${LLM_RESPONSES_POLL_INTERVAL_MS:-5000}
      # wewe-rss：容器内走服务名；AUTH 与下方 wewe-rss 服务 AUTH_CODE 一致
      WEWE_RSS_BASE_URL: ${WEWE_RSS_BASE_URL:-http://wewe-rss:4000}
      WEWE_RSS_AUTH_CODE: ${WEWE_RSS_AUTH_CODE:-}
      NEWS_PUBLIC_BASE_URL: ${NEWS_PUBLIC_BASE_URL:-}
      WEWE_LIVE_QR_SECRET: ${WEWE_LIVE_QR_SECRET:-}
      WEWE_LIVE_QR_TTL_HOURS: ${WEWE_LIVE_QR_TTL_HOURS:-48}
      WEWE_OPS_EMAIL: ${WEWE_OPS_EMAIL:-}
    ports:
      - "${APP_PORT:-3001}:3001"
    extra_hosts:
      # 供百科 CDP 回连宿主机 Chrome：BAIKE_CDP_URL=http://host.docker.internal:9222
      - "host.docker.internal:host-gateway"
    volumes:
      - app_uploads:/app/uploads
      - ./logs:/app/logs
      # 注释掉 .env 文件挂载，使用 docker-compose.yml 的环境变量
      # - ./.env:/app/.env:ro
      - ./server:/app/server
      - app_frontend:/app/client/dist
    networks:
      - newsapp-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health', (r) => {let data='';r.on('data',d=>data+=d);r.on('end',()=>{process.exit(r.statusCode===200?0:1)});r.on('error',e=>{console.error(e);process.exit(1)})})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # 增加到120秒，确保应用完全初始化（数据库初始化、定时任务等）

  # wewe-rss：私有公众号补抓（独立容器，与 app 同网络；勿打进 app 镜像）
  # 本地开发仍可只用 deploy/wewe-rss/docker-compose.yml；生产推荐本服务一并 up
  wewe-rss:
    image: cooderl/wewe-rss-sqlite:latest
    container_name: newsapp-wewe-rss
    restart: unless-stopped
    # 全量 feed 易把 Node 默认 ~2GB 堆打满（日志 FATAL heap out of memory）
    mem_limit: 5g
    environment:
      DATABASE_TYPE: sqlite
      AUTH_CODE: ${WEWE_RSS_AUTH_CODE:-change-me-wewe}
      FEED_MODE: ${WEWE_FEED_MODE:-fulltext}
      PLATFORM_URL: ${WEWE_PLATFORM_URL:-https://weread.111965.xyz}
      CRON_EXPRESSION: ${WEWE_CRON_EXPRESSION:-35 5,17 * * *}
      UPDATE_DELAY_TIME: ${WEWE_UPDATE_DELAY_TIME:-60s}
      MAX_REQUEST_PER_MINUTE: ${WEWE_MAX_REQUEST_PER_MINUTE:-60}
      # 浏览器直连 wewe 管理页时的外链根；嵌入走新闻反代时可填新闻公网地址
      SERVER_ORIGIN_URL: ${WEWE_SERVER_ORIGIN_URL:-http://127.0.0.1:4000}
      TZ: Asia/Shanghai
      NODE_OPTIONS: ${WEWE_NODE_OPTIONS:---max-old-space-size=4096}
    # 默认只绑本机，避免公网裸奔 4000；需要外网直连再改 WEWE_HOST_BIND=0.0.0.0
    ports:
      - "${WEWE_HOST_BIND:-127.0.0.1}:${WEWE_HOST_PORT:-4000}:4000"
    volumes:
      - ./deploy/wewe-rss/data:/app/data
    networks:
      - newsapp-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/',(r)=>{process.exit(r.statusCode&&r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: newsapp-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./deploy/ssl/aileading-fullchain.pem:/etc/nginx/ssl/aileading-fullchain.pem:ro
      - ./deploy/ssl/aileading-privkey.pem:/etc/nginx/ssl/aileading-privkey.pem:ro
      - app_frontend:/usr/share/nginx/html:ro
      - /opt/leadingpage:/opt/leadingpage:ro
    networks:
      - newsapp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
    driver: local
  app_frontend:
    driver: local
  app_uploads:
    driver: local

networks:
  newsapp-network:
    driver: bridge


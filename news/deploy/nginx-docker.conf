user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 上游服务器配置（Docker网络中的app服务）
    upstream app_backend {
        server app:3001;
    }

    server {
        listen 80;
        server_name _;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 分享/发布页嵌入其他系统菜单：不要带 X-Frame-Options，并允许任意父页面
        location ~ ^/(share|publish)(/|$) {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        # H5 只读端（client-h5 构建产物放到 html/h5/，与 PC dist 并列）
        location /h5/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /h5/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        # 前端入口与 SPA 回退：禁止缓存，确保部署后拿到最新 index.html 和新版 JS
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        # 明确禁止缓存 index.html（按路径请求时也生效）
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        # we-mp-rss API（前端请求根路径 /api/v1/...；须在通用 /api 前）
        location ^~ /api/v1/ {
            proxy_pass http://we-mp-rss:8001;
            proxy_http_version 1.1;
            proxy_set_header Host we-mp-rss;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_buffering on;
        }

        location ^~ /res/ {
            proxy_pass http://we-mp-rss:8001;
            proxy_http_version 1.1;
            proxy_set_header Host we-mp-rss;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API 代理
        location /api {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # we-mp-rss 管理页同源反代（浏览器用；服务端仍走 http://we-mp-rss:8001）
        location ^~ /we-mp-rss/ {
            rewrite ^/we-mp-rss/(.*)$ /$1 break;
            proxy_pass http://we-mp-rss:8001;
            proxy_http_version 1.1;
            proxy_set_header Host we-mp-rss;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
            proxy_buffering on;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header ETag;
            add_header X-Frame-Options "SAMEORIGIN" always;
            proxy_redirect ~^https?://[^/]+/(.*)$ /we-mp-rss/$1;
            proxy_redirect / /we-mp-rss/;
            sub_filter_once off;
            sub_filter_types text/css application/javascript text/javascript application/json;
            sub_filter '"/api/' '"/we-mp-rss/api/';
            sub_filter '"/assets/' '"/we-mp-rss/assets/';
            sub_filter '"/static/' '"/we-mp-rss/static/';
            sub_filter '"/docs/' '"/we-mp-rss/docs/';
            sub_filter '"/res/' '"/we-mp-rss/res/';
            sub_filter '"/views/' '"/we-mp-rss/views/';
            sub_filter '"/feed/' '"/we-mp-rss/feed/';
            sub_filter 'BASE_URL:"/"' 'BASE_URL:"/we-mp-rss/"';
        }

        location = /we-mp-rss {
            return 301 /we-mp-rss/;
        }

        # 健康检查
        location /health {
            proxy_pass http://app_backend/api/health;
            access_log off;
        }

        # 静态资源缓存
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}

